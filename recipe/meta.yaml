{% set name = "napari-ufish" %}
{% set version = "0.0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/napari-ufish-{{ version }}.tar.gz
  sha256: b149d1711cf043a32b038622a8b9efddb4c1e0d37144c9e9d068fd874994bd74

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 1

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools >=42.0.0
    - wheel
  run:
    - magicgui
    - napari
    - numpy
    - python >={{ python_min }}
    - qtpy
    - scikit-image
    - ufish

test:
  imports:
    - napari_ufish
  commands:
    - pip list
    - pip check
  requires:
    - pip
    - pyqt
    - python {{ python_min }}

about:
  home: https://pypi.org/project/napari-ufish
  summary: Deep learning-based FISH spot calling method.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jaimergp
